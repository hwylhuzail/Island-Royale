function building(x,z,w,d,h,i){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const cols=[0xe8dcc3,0xb8c5cc,0xd6bfa0,0x9aa5ad,0xe2d8c8];box(g,0,h/2,0,w,h,d,mat(cols[i%cols.length]));box(g,0,h+.4,0,w+.7,.6,d+.7,mat(0x3b454c));for(let f=0;f<Math.floor(h/3.4);f++)for(let c=0;c<Math.max(2,Math.floor(w/3));c++){const xx=-w/2+(c+.5)*w/Math.max(2,Math.floor(w/3)),yy=2+f*3.3;if(yy<h-.5)box(g,xx,yy,d/2+.06,w/Math.max(2,Math.floor(w/3))*.6,1.7,.08,glass);}}

// Real person with animated arms, legs, head
function makeRealPerson(){
  const g=new THREE.Group();const skin=skinTones[Math.floor(Math.random()*skinTones.length)];const h=1.55+Math.random()*.35;
  const legMat=mat(0x222222);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(.18,.55,.18),legMat);legL.position.set(-.14*h,.28*h,0);g.add(legL);
  const legR=new THREE.Mesh(new THREE.BoxGeometry(.18,.55,.18),legMat);legR.position.set(.14*h,.28*h,0);g.add(legR);
  const body=new THREE.Mesh(new THREE.BoxGeometry(.52*h,.72*h,.26*h),mat(shirtColors[Math.floor(Math.random()*shirtColors.length)]));body.position.y=.95*h;body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.19*h,16,12),mat(skin,.65));head.position.y=1.58*h;head.castShadow=true;g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.20*h,12,10,0,Math.PI*2,0,Math.PI*.55),mat(0x111111));hair.position.y=1.65*h;g.add(hair);
  const armL=new THREE.Mesh(new THREE.BoxGeometry(.11*h,.55*h,.11*h),mat(0xffffff));armL.position.set(-.36*h,1.05*h,0);g.add(armL);
  const armR=new THREE.Mesh(new THREE.BoxGeometry(.11*h,.55*h,.11*h),mat(0xffffff));armR.position.set(.36*h,1.05*h,0);g.add(armR);
  g.userData={armL,armR,legL,legR,head,ph:Math.random()*6,jump:Math.random()};
  return g;
}

function spawnSmoke(pos){const s=smokePool.find(x=>x.life<=0);if(!s)return;s.life=1;s.mesh.position.copy(pos);s.mesh.scale.setScalar(.5);}

function makeRaceCar(color,isBoda=false){
  const g=new THREE.Group();const bodyG=new THREE.Group();g.add(bodyG);
  let wheels=[], brakeLights=[], steering=null, driverHead=null, driverArmL=null, driverArmR=null;
  if(isBoda){
    box(bodyG,0,.6,0,.25,.6,1.9,mat(0xd32f2f));box(bodyG,0,1.05,-.4,.25,.5,.4,mat(0x222222));
    for(const sz of [-.65,.65]){const w=new THREE.Mesh(new THREE.TorusGeometry(.34,.06,8,16),mat(0x111111));w.rotation.y=Math.PI/2;w.position.set(0,.34,sz);bodyG.add(w);wheels.push(w);}
    const rider=makeRealPerson();rider.position.set(0,.55,-.1);rider.scale.setScalar(.9);bodyG.add(rider);driverHead=rider.userData.head;driverArmL=rider.userData.armL;driverArmR=rider.userData.armR;
  } else {
    const bodyMat=mat(color,.25,.5);
    const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.75,4.4),bodyMat);body.position.y=.65;body.castShadow=true;bodyG.add(body);
    const nose=new THREE.Mesh(new THREE.BoxGeometry(1.9,.45,1),bodyMat);nose.position.set(0,.55,2.4);bodyG.add(nose);
    const cab=new THREE.Mesh(new THREE.BoxGeometry(1.75,.65,2.1),glass);cab.position.set(0,1.25,-.2);cab.castShadow=true;bodyG.add(cab);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(1.8,.08,2.1),bodyMat);roof.position.set(0,1.6,-.2);bodyG.add(roof);
    // Spoiler for BMW
    if(color===0xe74c3c){box(bodyG,0,1.15,-2.2,1.9,.08,.4,mat(0x111111));}
    // Headlights + brake lights that glow when braking
    [-.7,.7].forEach(x=>{const hl=new THREE.Mesh(new THREE.BoxGeometry(.35,.15,.05),new THREE.MeshBasicMaterial({color:0xfff9a0}));hl.position.set(x,.65,2.92);bodyG.add(hl);});
    [-.7,.7].forEach(x=>{const tl=new THREE.Mesh(new THREE.BoxGeometry(.38,.18,.05),new THREE.MeshBasicMaterial({color:0x550000}));tl.position.set(x,.68,-2.22);bodyG.add(tl);brakeLights.push(tl);});
    // Wheels - separate groups so they spin + steer
    for(const sx of [-1.05,1.05])for(const sz of [-1.4,1.4]){
      const wg=new THREE.Group();wg.position.set(sx,.38,sz);bodyG.add(wg);
      const tyre=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.28,14),mat(0x151515));tyre.rotation.z=Math.PI/2;tyre.castShadow=true;wg.add(tyre);
      const hub=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.3,10),mat(0xaaaaaa,.4,.6));hub.rotation.z=Math.PI/2;wg.add(hub);
      wheels.push({group:wg,tyre,front:sz>0});
    }
    // Steering wheel
    steering=new THREE.Mesh(new THREE.TorusGeometry(.22,.03,8,16),mat(0x111111));steering.position.set(-.4,1.1,0.7);steering.rotation.x=-.4;bodyG.add(steering);
    const driver=makeRealPerson();driver.position.set(-.4,.55,-.3);driver.scale.setScalar(.85);bodyG.add(driver);driverHead=driver.userData.head;driverArmL=driver.userData.armL;driverArmR=driver.userData.armR;
  }
  scene.add(g);
  return {group:g,bodyG,wheels,brakeLights,steering,driverHead,driverArmL,driverArmR,suspension:0,lean:0,drift:0};
}

function startRace(e){

// Animate ONE car realistically - wheels, lean, suspension, steering, brake lights
function animateCar(car, speedVal, steeringInput, braking, dt, time){
  const isBoda=car.cfg.name==="Boda";
  // Wheels spin + steer
  car.wheels.forEach(w=>{
    if(isBoda){w.rotation.x+=speedVal*dt*2;}
    else{
      w.tyre.rotation.x+=speedVal*dt*2.2;
      if(w.front) w.group.rotation.y=steeringInput*.45;
    }
  });
  // Body lean - lean into turn
  const targetLean=THREE.MathUtils.clamp(-steeringInput*Math.abs(speedVal)/60,-.18,.18);
  car.lean+=(targetLean-car.lean)*dt*6;
  // Suspension bounce - bumps + speed vibration
  const targetSusp=Math.sin(time*18)*.02*Math.min(1,Math.abs(speedVal)/40) + (braking?-.06:0) + (speedVal>50?.02:0);
  car.suspension+=(targetSusp-car.suspension)*dt*10;
  // Boda leans a lot, car leans less
  if(isBoda){car.bodyG.rotation.z=car.lean*1.8;car.bodyG.rotation.x=car.suspension;car.bodyG.position.y=car.suspension;}
  else{car.bodyG.rotation.z=car.lean;car.bodyG.rotation.x=car.suspension*.6;car.bodyG.position.y=car.suspension;car.bodyG.rotation.y=Math.sin(time*2)*.002;}
  // Brake lights glow
  car.brakeLights.forEach(l=>{l.material.color.setHex(braking?0xff0000:0x550000);});
  // Steering wheel + driver
  if(car.steering) car.steering.rotation.z=-steeringInput*1.2;
  if(car.driverHead) car.driverHead.rotation.y=steeringInput*.5;
  if(car.driverArmL) car.driverArmL.rotation.x=Math.sin(time*10)*.05-.2;
  if(car.driverArmR) car.driverArmR.rotation.x=Math.sin(time*10+.5)*.05-.2;
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
  if(started&&playerCar&&!finished){
    raceTime+=dt;
    const cfg=playerCar.cfg;
    const boosting=(keys.ShiftLeft||keys.ShiftRight)&&boost>0;
    const braking=!!keys.KeyS;
    if(keys.KeyW){speed+=cfg.acc*dt*(boosting?1.6:1);if(boosting)boost=Math.max(0,boost-dt*25);}else speed-=dt*8;
    if(braking)speed-=dt*32;if(!keys.KeyW&&!keys.KeyS)speed-=dt*4;
    // Steering with smooth turn
    let steerInput=0;if(keys.KeyA)steerInput=1;if(keys.KeyD)steerInput=-1;
    steerVisual+=(steerInput-steerVisual)*dt*8;
    if(steerInput!==0) playerCar.angle+=cfg.turn*dt*Math.min(1,Math.abs(speed)/20)*steerInput;
    // Drift - if turning fast at high speed
    const drifting=Math.abs(steerInput)>0&&Math.abs(speed)>38;
    if(drifting){
      spawnSmoke(playerCar.mesh.position.clone().add(new THREE.Vector3(1,0,-1.4)));
      spawnSmoke(playerCar.mesh.position.clone().add(new THREE.Vector3(-1,0,-1.4)));
      spawnSkid(playerCar.mesh.position,playerCar.angle);
      speed-=dt*6;
    }
    speed=THREE.MathUtils.clamp(speed,-15,boosting?cfg.top*1.3:cfg.top);
    if(Math.abs(speed)<0.1)speed=0;boost=Math.min(100,boost+dt*8);
    playerCar.mesh.position.x+=Math.sin(playerCar.angle)*speed*dt;playerCar.mesh.position.z+=Math.cos(playerCar.angle)*speed*dt;
    playerCar.mesh.rotation.y=playerCar.angle;
    animateCar(playerCar,speed,steerVisual,braking,dt,t);
    const cp=getProgress(playerCar.mesh.position);
    if(cp>playerCar.check&&cp<5)playerCar.check=cp;
    if(cp===0&&playerCar.check>=3){playerCar.lap++;playerCar.check=0;if(playerCar.lap<=3)say('LAP '+playerCar.lap+'! Keep going!');if(playerCar.lap>3){finished=true;cash+=500000;say('YOU WON! +500,000 UGX');setTimeout(()=>location.reload(),3500);}}
    playerCar.progress=cp;
    opponents.forEach(o=>{
      if(o.finished)return;const target=trackPoints[o.targetIdx];
      const dx=target.x-o.mesh.position.x,dz=target.z-o.mesh.position.z;const want=Math.atan2(dx,dz);
      let diff=want-o.angle;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
      const oSteer=THREE.MathUtils.clamp(diff,-1,1);
      o.angle+=THREE.MathUtils.clamp(diff,-o.cfg.turn*dt,o.cfg.turn*dt);
      const targetSpeed=o.cfg.top*.75*o.skill*(Math.abs(diff)>.5?0.4:1);
      const oBraking=Math.abs(diff)>.6;
      o.speed+=(targetSpeed-o.speed)*dt*1.2;
      o.mesh.position.x+=Math.sin(o.angle)*o.speed*dt;o.mesh.position.z+=Math.cos(o.angle)*o.speed*dt;o.mesh.rotation.y=o.angle;
      animateCar(o,o.speed,oSteer,oBraking,dt,t+o.targetIdx);
      if(Math.hypot(dx,dz)<18)o.targetIdx=(o.targetIdx+1)%trackPoints.length;
      const ocp=getProgress(o.mesh.position);if(ocp>o.check)o.check=ocp;if(ocp===0&&o.check>=3){o.lap++;o.check=0;if(o.lap>3)o.finished=true;}
      o.progress=ocp;
      if(o.mesh.position.distanceTo(playerCar.mesh.position)<3.4){speed*=0.45;o.speed*=0.55;shake=.6;say('CRASH!');spawnSmoke(playerCar.mesh.position);}
    });
    // Camera with shake + FOV kick on boost
    const camDist=boosting?10.5:9;
    const camPos=playerCar.mesh.position.clone().add(new THREE.Vector3(-Math.sin(playerCar.angle)*camDist,4.2,-Math.cos(playerCar.angle)*camDist));
    if(shake>0){camPos.x+=(Math.random()-.5)*shake;camPos.y+=(Math.random()-.5)*shake;shake-=dt*2;}
    camera.position.lerp(camPos,1-Math.exp(-6*dt));camera.lookAt(playerCar.mesh.position.clone().add(new THREE.Vector3(0,1.5,0)));
    camera.fov+=( (boosting?72:65) - camera.fov)*dt*4;camera.updateProjectionMatrix();
    // Crowd - jump when player passes, wave
    crowd.forEach(p=>{
      const d=p.position.distanceTo(playerCar.mesh.position);
      const u=p.userData;
      if(d<25){p.position.y=Math.abs(Math.sin(t*8+u.ph))*.4;u.armL.rotation.z=2.5;u.armR.rotation.z=-2.5;u.legL.rotation.x=.4;u.legR.rotation.x=-.4;}
      else{p.position.y=0;u.armL.rotation.z=Math.sin(t*4+u.ph)*.8;u.armR.rotation.z=-Math.sin(t*4+u.ph)*.8;u.legL.rotation.x=Math.sin(t*6+u.ph)*.2;u.legR.rotation.x=-Math.sin(t*6+u.ph)*.2;}
      u.head.rotation.y=Math.sin(t*2+u.ph)*.4;
    });
    updateSmoke(dt);updateSkid(dt);
    const c=$('map').getContext('2d');c.clearRect(0,0,200,200);c.fillStyle='#2a4a35';c.fillRect(0,0,200,200);const px=x=>(x+300)/600*200,pz=z=>(z+300)/600*200;c.strokeStyle='#ffd166';c.lineWidth=4;c.beginPath();trackPoints.forEach((p,i)=>{if(i===0)c.moveTo(px(p.x),pz(p.z));else c.lineTo(px(p.x),pz(p.z));});c.closePath();c.stroke();c.fillStyle='#f44';opponents.forEach(o=>c.fillRect(px(o.mesh.position.x)-2,pz(o.mesh.position.z)-2,4,4));c.fillStyle='#fff';c.beginPath();c.arc(px(playerCar.mesh.position.x),pz(playerCar.mesh.position.z),5,0,7);c.fill();
    updateHUD();
  } else {
    // Idle animation before start - crowd still moves
    crowd.forEach(p=>{const u=p.userData;u.armL.rotation.z=Math.sin(t*3+u.ph)*.6;u.armR.rotation.z=-Math.sin(t*3+u.ph)*.6;});
  }
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}catch(err){document.getElementById('debug').textContent='Error: '+err.message;console.error(err);}
</script>
